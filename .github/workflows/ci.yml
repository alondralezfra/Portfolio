name: CI

# The same gate used locally (`npm run verify`), run on every pull request and every push to main.
# Nothing should merge unless this is green.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify (unit tests, build, end-to-end + accessibility)
        run: npm run verify
        env:
          CI: "1"
